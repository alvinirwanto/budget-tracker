<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Offline — Luar</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: Canvas; color: CanvasText; text-align: center; }
    main { max-width: 22rem; }
    .logo { width: 64px; height: 64px; border-radius: 20px; background: #ff3378; margin: 0 auto 24px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; line-height: 1.5; opacity: .7; }
    button { font: inherit; font-weight: 700; color: #fff; background: #ff3378; border: 0; border-radius: 999px; padding: 14px 28px; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true"></div>
    <h1>You are offline</h1>
    <p>Luar needs a connection to load your data. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
